<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8b5cf6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="欢乐骰子" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>欢乐骰子 · Happy Dice</title>
  <style>
    :root {
      --bg-1: #fef08a;
      --bg-2: #fbcfe8;
      --bg-3: #bae6fd;
      --card-bg: rgba(255, 255, 255, 0.9);
      --mat-bg: rgba(255, 255, 255, 0.52);
      --mat-border: rgba(255, 255, 255, 0.92);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #8b5cf6;
      --accent-dark: #6d28d9;
      --roll-top: #ff6b6b;
      --roll-bot: #ee5253;
      --roll-shadow: #c92a2a;
      --die-size: 112px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Comic Sans MS", "Chalkboard SE", system-ui, -apple-system, sans-serif;
      background: linear-gradient(155deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      color: var(--text-main);
    }

    /* App Shell with iOS/Android Safe Area Insets */
    .app-shell {
      width: 100%;
      height: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding:
        max(10px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Top Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px 14px;
      border-radius: 22px;
      border: 3px solid #fff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.07);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-logo {
      font-size: 1.55rem;
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.12));
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #ec4899;
      text-shadow: 1px 2px 0 #fce7f3;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: #fff;
      border: 2.5px solid #e2e8f0;
      border-radius: 14px;
      min-height: 40px;
      min-width: 40px;
      padding: 6px 10px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 800;
      color: #475569;
      cursor: pointer;
      box-shadow: 0 3px 0 #cbd5e1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    .icon-btn.active {
      background: #e0f2fe;
      border-color: #38bdf8;
      color: #0284c7;
      box-shadow: 0 3px 0 #7dd3fc;
    }

    .icon-btn .btn-label {
      font-size: 0.85rem;
    }

    /* Controls Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-bar {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 18px;
      border: 2.5px solid #fff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      gap: 4px;
    }

    .bar-caption {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-muted);
      padding: 0 6px 0 8px;
      white-space: nowrap;
    }

    .count-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 12px;
      background: transparent;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .count-btn.selected {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 3px 0 var(--accent-dark);
      transform: translateY(-1px);
    }

    .theme-btn {
      height: 38px;
      padding: 0 11px;
      border: none;
      border-radius: 12px;
      background: transparent;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .theme-btn.selected {
      background: #ec4899;
      color: #fff;
      box-shadow: 0 3px 0 #be185d;
      transform: translateY(-1px);
    }

    .quiz-toggle {
      height: 46px;
      padding: 0 14px;
      border-radius: 18px;
      border: 2.5px solid #fff;
      background: var(--card-bg);
      color: #7c3aed;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .quiz-toggle.active {
      background: #fef08a;
      border-color: #facc15;
      color: #b45309;
      box-shadow: 0 3px 0 #eab308;
    }

    /* Main Workspace (Splits in Landscape / Large Tablets) */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Soft Play Mat / Dice Tray */
    .play-mat {
      flex: 1;
      min-height: 0;
      background: var(--mat-bg);
      border: 4px solid var(--mat-border);
      border-radius: 30px;
      box-shadow:
        inset 0 6px 20px rgba(15, 23, 42, 0.06),
        0 8px 24px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
      cursor: pointer;
      overflow: hidden;
    }

    .mat-hint {
      position: absolute;
      bottom: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      color: rgba(71, 85, 105, 0.68);
      pointer-events: none;
      text-align: center;
      padding: 0 12px;
    }

    /* Dice Grid inside Mat */
    .dice-grid {
      display: grid;
      align-items: center;
      justify-items: center;
      justify-content: center;
      align-content: center;
      gap: 22px 26px;
      width: 100%;
      height: 100%;
    }

    .dice-grid[data-count="1"] { grid-template-columns: repeat(1, auto); }
    .dice-grid[data-count="2"] { grid-template-columns: repeat(2, auto); gap: 28px; }
    .dice-grid[data-count="3"] { grid-template-columns: repeat(3, auto); gap: 20px; }
    .dice-grid[data-count="4"] { grid-template-columns: repeat(2, auto); gap: 20px 28px; }
    .dice-grid[data-count="5"],
    .dice-grid[data-count="6"] { grid-template-columns: repeat(3, auto); gap: 18px 20px; }

    /* Die Slot + Jump Arc + Shadow */
    .die-slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .die-jumper {
      transition: transform 0.25s ease;
      will-change: transform;
    }

    .die-jumper.jumping {
      animation: dieJumpArc 0.76s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .die-jumper.wiggle {
      animation: dieTapPop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes dieJumpArc {
      0%   { transform: translateY(0) scale(1); }
      35%  { transform: translateY(-42px) scale(1.08); }
      72%  { transform: translateY(4px) scale(0.95); }
      88%  { transform: translateY(-8px) scale(1.02); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes dieTapPop {
      0%   { transform: scale(1) translateY(0); }
      45%  { transform: scale(1.16) translateY(-10px); }
      100% { transform: scale(1) translateY(0); }
    }

    .die-shadow {
      width: calc(var(--die-size) * 0.78);
      height: calc(var(--die-size) * 0.16);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.22) 0%, rgba(15, 23, 42, 0) 72%);
      margin-top: calc(var(--die-size) * 0.11);
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
    }

    .die-slot.is-jumping .die-shadow {
      animation: shadowPulse 0.76s ease;
    }

    @keyframes shadowPulse {
      0%   { transform: scale(1); opacity: 0.9; }
      35%  { transform: scale(0.55); opacity: 0.35; }
      72%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    /* 3D Cube Scene */
    .scene {
      width: var(--die-size);
      height: var(--die-size);
      perspective: calc(var(--die-size) * 5.5);
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.76s cubic-bezier(0.18, 0.89, 0.32, 1.14);
      will-change: transform;
    }

    /* Inner solid filler planes so rounded corners never look hollow during 3D spin */
    .cube-core {
      position: absolute;
      inset: 6%;
      border-radius: 18%;
      background: var(--die-border, #e2e8f0);
      pointer-events: none;
    }
    .core-x { transform: rotateX(90deg); }
    .core-y { transform: rotateY(90deg); }
    .core-z { transform: translateZ(0); }

    .cube-face {
      position: absolute;
      width: var(--die-size);
      height: var(--die-size);
      border-radius: calc(var(--die-size) * 0.21);
      background: var(--die-bg, #ffffff);
      border: max(2.5px, calc(var(--die-size) * 0.032)) solid var(--die-border, #e2e8f0);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.06);
      display: grid;
      grid-template-areas:
        "a . c"
        "e g f"
        "d . b";
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: calc(var(--die-size) * 0.14);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face-1 { transform: rotateY(  0deg) translateZ(calc(var(--die-size) / 2)); }
    .face-6 { transform: rotateY(180deg) translateZ(calc(var(--die-size) / 2)); }
    .face-2 { transform: rotateY(-90deg) translateZ(calc(var(--die-size) / 2)); }
    .face-5 { transform: rotateY( 90deg) translateZ(calc(var(--die-size) / 2)); }
    .face-3 { transform: rotateX( 90deg) translateZ(calc(var(--die-size) / 2)); }
    .face-4 { transform: rotateX(-90deg) translateZ(calc(var(--die-size) / 2)); }

    .pip {
      width: calc(var(--die-size) * 0.175);
      height: calc(var(--die-size) * 0.175);
      border-radius: 50%;
      background: var(--pip-color, #1e293b);
      align-self: center;
      justify-self: center;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.25);
    }

    .face-1 .pip {
      width: calc(var(--die-size) * 0.28);
      height: calc(var(--die-size) * 0.28);
      background: var(--pip-one, #ef4444);
    }

    .pip-a { grid-area: a; }
    .pip-b { grid-area: b; }
    .pip-c { grid-area: c; }
    .pip-d { grid-area: d; }
    .pip-e { grid-area: e; }
    .pip-f { grid-area: f; }
    .pip-g { grid-area: g; }

    /* Bottom / Side Dock: Score Card + Big Roll Button + History */
    .dock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .result-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 3px solid #fff;
      border-radius: 24px;
      padding: 10px 18px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result-card.pop {
      transform: scale(1.05);
    }

    .equation-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 30px;
      margin-bottom: 2px;
    }

    .eq-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 28px;
      padding: 0 8px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 900;
      border: 2px solid transparent;
    }

    .eq-op {
      font-size: 1.15rem;
      font-weight: 900;
      color: #64748b;
    }

    .dots-preview {
      font-size: 1.15rem;
      letter-spacing: 4px;
      color: #ec4899;
    }

    .score-main-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .total-number {
      font-size: 2.75rem;
      font-weight: 900;
      line-height: 1.05;
      color: #7c3aed;
      text-shadow: 2px 3px 0 #ede9fe;
    }

    .badge-msg {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 999px;
      background: #fef08a;
      color: #b45309;
      font-weight: 800;
      font-size: 0.88rem;
    }

    /* Quiz Answer Choices */
    .quiz-choices {
      display: none;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }

    .quiz-choices.visible {
      display: flex;
    }

    .quiz-choice-btn {
      min-width: 68px;
      height: 50px;
      border-radius: 16px;
      border: 3px solid #ddd6fe;
      background: #f5f3ff;
      color: #6d28d9;
      font-family: inherit;
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #c4b5fd;
      transition: transform 0.12s, background 0.15s, opacity 0.2s;
    }

    .quiz-choice-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c4b5fd;
    }

    .quiz-choice-btn.wrong {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #ef4444;
      box-shadow: none;
      opacity: 0.55;
      animation: shakeWrong 0.35s ease;
    }

    .quiz-choice-btn.correct {
      background: #dcfce7;
      border-color: #4ade80;
      color: #15803d;
      box-shadow: 0 4px 0 #86efac;
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Giant Kid-Friendly Roll Button */
    .roll-row {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .roll-btn {
      flex: 1;
      max-width: 360px;
      height: 62px;
      background: linear-gradient(180deg, var(--roll-top) 0%, var(--roll-bot) 100%);
      color: #fff;
      border: 3.5px solid #fff;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 7px 0 var(--roll-shadow), 0 12px 22px rgba(238, 82, 83, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .roll-btn:active,
    .roll-btn.pressed {
      transform: translateY(5px);
      box-shadow: 0 2px 0 var(--roll-shadow), 0 5px 10px rgba(238, 82, 83, 0.3);
    }

    /* History Strip */
    .history-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 4px;
    }
    .history-bar::-webkit-scrollbar { display: none; }

    .history-chip {
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #fff;
      border-radius: 10px;
      padding: 3px 9px;
      font-weight: 800;
      font-size: 0.82rem;
      color: #475569;
      white-space: nowrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      animation: popIn 0.22s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }

    /* QR & Share Modal */
    .qr-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .qr-modal-backdrop.open {
      display: flex;
    }
    .qr-modal {
      background: #fff;
      border-radius: 28px;
      padding: 22px 20px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.24);
      border: 4px solid #f472b6;
      animation: popIn 0.2s ease-out;
    }
    .qr-modal h2 {
      margin: 0 0 6px;
      color: #ec4899;
      font-size: 1.3rem;
    }
    .qr-modal p {
      margin: 0 0 12px;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .qr-modal img {
      width: 200px;
      height: 200px;
      border-radius: 16px;
      border: 3px solid #f1f5f9;
      display: block;
      margin: 0 auto 12px;
    }
    .qr-url-box {
      font-size: 0.76rem;
      color: #475569;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 14px;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .qr-modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .modal-btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }
    .modal-btn-copy {
      background: #e0f2fe;
      color: #0284c7;
    }
    .modal-btn-close {
      background: #8b5cf6;
      color: #fff;
      box-shadow: 0 3px 0 #6d28d9;
    }

    /* =====================================================================
       RESPONSIVE BREAKPOINTS: MOBILE PORTRAIT, TABLET/iPAD, & LANDSCAPE
       ===================================================================== */

    /* 1. Small / Standard Mobile Portrait (< 600px) */
    @media (max-width: 599px) and (orientation: portrait) {
      .app-shell {
        gap: 7px;
      }
      .header {
        padding: 6px 10px;
        border-radius: 18px;
      }
      .header-actions {
        gap: 5px;
      }
      .brand-title {
        font-size: 1.06rem;
      }
      .icon-btn {
        padding: 4px 7px;
        min-height: 34px;
        min-width: 34px;
        font-size: 0.92rem;
      }
      .icon-btn .btn-label {
        display: none;
      }
      .toolbar {
        gap: 6px;
      }
      .bar-caption {
        display: none;
      }
      .toolbar > .pill-bar:first-child { order: 1; }
      .toolbar > .quiz-toggle { order: 2; }
      .toolbar > .pill-bar:nth-child(2) { order: 3; }
      .count-btn {
        width: 31px;
        height: 32px;
        font-size: 0.95rem;
        border-radius: 10px;
      }
      .theme-btn {
        height: 32px;
        padding: 0 9px;
        font-size: 0.82rem;
        border-radius: 10px;
      }
      .quiz-toggle {
        height: 40px;
        padding: 0 10px;
        font-size: 0.84rem;
        border-radius: 15px;
      }

      /* Dynamic die size by dice count so 1-6 dice fit mobile screen cleanly */
      .play-mat[data-count="1"] { --die-size: 128px; }
      .play-mat[data-count="2"] { --die-size: 104px; }

  <script src="./lib/web-natural-tts.js"></script>
  <script>
    // =========================================================================
    // 1. Localization (Chinese & English)
    // =========================================================================
    const I18N = {

      },

        quizRight: '🎉 Awesome! Correct!',
        quizRetry: '🤔 Try counting again!',
        speakSingle: (n) => `${n}`,
        speakQuizRight: (vals, sum) => vals.length === 1 ? `Awesome! It is ${sum}!` : `Great job! ${vals.join(' + ')} = ${sum}!`,
        speakQuizRetry: 'Try counting again!',
        speakQuizPrompt: (vals) => vals.length === 1 ? 'How many dots do you see?' : `What is ${vals.join(' + ')}?`,
        qrTitle: '📱 Scan for Phone / iPad',
        qrSub: 'Use "Add to Home Screen" for fullscreen play!',
        copyLink: 'Copy Link',
        copied: 'Copied ✓',
        close: 'Close'
      }
    };

    // =========================================================================
    // 2. Dice Geometry & Color Palettes
    // =========================================================================
    const FACE_PIPS = {
      1: ['g'],
      2: ['a', 'b'],
      3: ['a', 'g', 'b'],
      4: ['a', 'c', 'd', 'b'],
      5: ['a', 'c', 'g', 'd', 'b'],
      6: ['a', 'c', 'e', 'f', 'd', 'b']
    };

    const FACE_ROTATIONS = {
      1: { x: 0,   y: 0   },
      6: { x: 0,   y: 180 },
      2: { x: 0,   y: 90  },
      5: { x: 0,   y: -90 },
      3: { x: -90, y: 0   },
      4: { x: 90,  y: 0   }
    };

    const THEMES = {
      classic: [
        { bg: '#ffffff', border: '#cbd5e1', pip: '#1e293b', one: '#ef4444', pillBg: '#f1f5f9', pillText: '#1e293b' }
      ],
      candy: [
        { bg: '#fce7f3', border: '#f472b6', pip: '#9d174d', one: '#db2777', pillBg: '#fce7f3', pillText: '#9d174d' },
        { bg: '#e0f2fe', border: '#38bdf8', pip: '#075985', one: '#0284c7', pillBg: '#e0f2fe', pillText: '#075985' },
        { bg: '#fef3c7', border: '#fbbf24', pip: '#92400e', one: '#d97706', pillBg: '#fef3c7', pillText: '#92400e' },
        { bg: '#dcfce7', border: '#4ade80', pip: '#166534', one: '#16a34a', pillBg: '#dcfce7', pillText: '#166534' },
        { bg: '#f3e8ff', border: '#c084fc', pip: '#6b21a8', one: '#9333ea', pillBg: '#f3e8ff', pillText: '#6b21a8' },
        { bg: '#ffedd5', border: '#fb923c', pip: '#9a3412', one: '#ea580c', pillBg: '#ffedd5', pillText: '#9a3412' }
      ],
      rainbow: [
        { bg: '#fee2e2', border: '#f87171', pip: '#991b1b', one: '#dc2626', pillBg: '#fee2e2', pillText: '#991b1b' },
        { bg: '#ffedd5', border: '#fb923c', pip: '#9a3412', one: '#ea580c', pillBg: '#ffedd5', pillText: '#9a3412' },
        { bg: '#fef9c3', border: '#facc15', pip: '#854d0e', one: '#ca8a04', pillBg: '#fef9c3', pillText: '#854d0e' },
        { bg: '#dcfce7', border: '#4ade80', pip: '#166534', one: '#16a34a', pillBg: '#dcfce7', pillText: '#166534' },
        { bg: '#dbeafe', border: '#60a5fa', pip: '#1e40af', one: '#2563eb', pillBg: '#dbeafe', pillText: '#1e40af' },
        { bg: '#ede9fe', border: '#a78bfa', pip: '#5b21b6', one: '#7c3aed', pillBg: '#ede9fe', pillText: '#5b21b6' }
      ],
      ocean: [
        { bg: '#ecfeff', border: '#22d3ee', pip: '#155e75', one: '#0891b2', pillBg: '#ecfeff', pillText: '#155e75' },
        { bg: '#dbeafe', border: '#60a5fa', pip: '#1e3a8a', one: '#2563eb', pillBg: '#dbeafe', pillText: '#1e3a8a' },
        { bg: '#ccfbf1', border: '#2dd4bf', pip: '#115e59', one: '#0d9488', pillBg: '#ccfbf1', pillText: '#115e59' }
      ]
    };

    // Xylophone scale notes for tapping dice values 1..6 (C5..A5)
    const XYLOPHONE_NOTES = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0];

    // =========================================================================
    // 3. State & Audio / NaturalTTS Initialization
    // =========================================================================
    let lang = (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'zh';
    let diceCount = 1;
    let currentTheme = 'classic';
    let sfxEnabled = true;
    let voiceEnabled = true;
    let quizMode = false;
    let quizSolved = true;
    let isRolling = false;
    let diceState = [];
    let history = [];

    const tts = window.NaturalTTS
      ? new window.NaturalTTS({
          lang: lang === 'zh' ? 'zh-CN' : 'en-US',
          rate: 0.94,
          pitch: 1.0,
          filterEmojis: true,
          normalizeMath: true,
          autoUnlock: true
        })
      : null;

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playClack(delay = 0, pitch = 300) {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, ctx.currentTime + delay);
        osc.frequency.exponentialRampToValueAtTime(95, ctx.currentTime + delay + 0.05);
        gain.gain.setValueAtTime(0.2, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.055);
      } catch (_) {}
    }

    function playTone(freq, duration = 0.22, type = 'sine', delay = 0) {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        const start = ctx.currentTime + delay;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.2, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + duration + 0.02);
      } catch (_) {}
    }

    function playSuccessChime(isSpecial = false) {
      const notes = isSpecial ? [523.25, 659.25, 783.99, 1046.5] : [523.25, 659.25, 783.99];
      notes.forEach((f, idx) => playTone(f, 0.26, 'sine', idx * 0.075));
    }

    function playGentleBoing() {
      playTone(260, 0.18, 'triangle', 0);
      playTone(210, 0.22, 'triangle', 0.09);
    }

    function speakText(text) {
      if (!voiceEnabled || !tts) return;
      const ttsLang = lang === 'zh' ? 'zh-CN' : 'en-US';
      tts.speak(text, { lang: ttsLang, rate: lang === 'zh' ? 0.95 : 0.98 });
    }

    function triggerHaptic(pattern) {
      try {
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (_) {}
    }

    // =========================================================================
    // 4. DOM References
    // =========================================================================
    const playMatEl = document.getElementById('play-mat');
    const diceGridEl = document.getElementById('dice-grid');
    const eqRowEl = document.getElementById('equation-row');
    const totalNumEl = document.getElementById('total-number');
    const badgeMsgEl = document.getElementById('badge-msg');
    const quizChoicesEl = document.getElementById('quiz-choices');
    const resultCardEl = document.getElementById('result-card');
    const rollBtn = document.getElementById('roll-btn');
    const historyBar = document.getElementById('history-bar');

    // =========================================================================
    // 5. Build & Render 3D Dice
    // =========================================================================
    function getPalette(index) {
      const list = THEMES[currentTheme] || THEMES.classic;
      return list[index % list.length];
    }

    function applyDieTheme(cubeEl, index) {
      const p = getPalette(index);
      cubeEl.style.setProperty('--die-bg', p.bg);
      cubeEl.style.setProperty('--die-border', p.border);
      cubeEl.style.setProperty('--pip-color', p.pip);
      cubeEl.style.setProperty('--pip-one', p.one);
    }

    function createDieSlot(index) {
      const slot = document.createElement('div');
      slot.className = 'die-slot';

      const jumper = document.createElement('div');
      jumper.className = 'die-jumper';

      const scene = document.createElement('div');
      scene.className = 'scene';

      const cube = document.createElement('div');
      cube.className = 'cube';

      // Solid inner core planes so rounded edges never look transparent
      ['core-x', 'core-y', 'core-z'].forEach(cls => {
        const core = document.createElement('div');
        core.className = `cube-core ${cls}`;
        cube.appendChild(core);
      });

      for (let face = 1; face <= 6; face++) {
        const faceEl = document.createElement('div');
        faceEl.className = `cube-face face-${face}`;
        FACE_PIPS[face].forEach(area => {
          const pip = document.createElement('span');
          pip.className = `pip pip-${area}`;
          faceEl.appendChild(pip);
        });
        cube.appendChild(faceEl);
      }

      scene.appendChild(cube);
      jumper.appendChild(scene);

      const shadow = document.createElement('div');
      shadow.className = 'die-shadow';

      slot.appendChild(jumper);
      slot.appendChild(shadow);

      applyDieTheme(cube, index);

      // Tapping an individual die wiggles it, plays its xylophone note, and reads its value!
      slot.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isRolling) return;
        const dieObj = diceState[index];
        if (!dieObj) return;
        jumper.classList.remove('wiggle');
        void jumper.offsetWidth;
        jumper.classList.add('wiggle');
        triggerHaptic(15);
        playTone(XYLOPHONE_NOTES[(dieObj.value - 1) % 6], 0.25, 'sine');
        speakText(I18N[lang].speakSingle(dieObj.value));
      });

      return { slot, jumper, cube };
    }

    function setCubeRotation(dieObj, faceVal, animate = true) {
      const target = FACE_ROTATIONS[faceVal];
      if (animate) {
        dieObj.xSpin += (2 + Math.floor(Math.random() * 2)) * 360;
        dieObj.ySpin += (2 + Math.floor(Math.random() * 2)) * 360;
      }
      const rx = dieObj.xSpin + target.x;
      const ry = dieObj.ySpin + target.y;
      dieObj.cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }

    function buildDiceTray() {
      playMatEl.dataset.count = String(diceCount);
      diceGridEl.dataset.count = String(diceCount);
      diceGridEl.innerHTML = '';
      diceState = [];

      for (let i = 0; i < diceCount; i++) {
        const { slot, jumper, cube } = createDieSlot(i);
        diceGridEl.appendChild(slot);
        const initVal = (i % 6) + 1 === 1 && diceCount === 1 ? 6 : ((i % 6) + 1);
        const stateObj = { slot, jumper, cube, xSpin: 0, ySpin: 0, value: initVal };
        diceState.push(stateObj);
        setCubeRotation(stateObj, initVal, false);
      }

      quizSolved = true;
      updateScoreDisplay(diceState.map(d => d.value), false);
    }

    // =========================================================================
    // 6. Roll Logic & Quiz Mode
    // =========================================================================
    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      rollBtn.classList.add('pressed');
      setTimeout(() => rollBtn.classList.remove('pressed'), 160);
      triggerHaptic([20, 35, 20]);

      for (let i = 0; i < 6; i++) {
        playClack(i * 0.085, 250 + Math.random() * 230);
      }

      const newValues = [];
      diceState.forEach((die, idx) => {
        const val = 1 + Math.floor(Math.random() * 6);
        die.value = val;
        newValues.push(val);

        setTimeout(() => {
          die.slot.classList.remove('is-jumping');
          die.jumper.classList.remove('jumping');
          void die.jumper.offsetWidth;
          die.slot.classList.add('is-jumping');
          die.jumper.classList.add('jumping');
          setCubeRotation(die, val, true);
        }, idx * 35);
      });

      const finishDelay = 770 + (diceState.length - 1) * 35;
      setTimeout(() => {
        diceState.forEach(d => {
          d.slot.classList.remove('is-jumping');
          d.jumper.classList.remove('jumping');
        });
        triggerHaptic(30);
        updateScoreDisplay(newValues, true);
        isRolling = false;
      }, finishDelay);
    }

    function renderEquationRow(values, hideTotal = false) {
      eqRowEl.innerHTML = '';
      if (values.length === 1) {
        if (hideTotal) {
          const span = document.createElement('span');
          span.className = 'eq-op';
          span.textContent = I18N[lang].quizAskCount;
          eqRowEl.appendChild(span);
        } else {
          const dots = document.createElement('span');
          dots.className = 'dots-preview';
          dots.textContent = '●'.repeat(values[0]);
          eqRowEl.appendChild(dots);
        }
        return;
      }

      values.forEach((v, idx) => {
        if (idx > 0) {
          const op = document.createElement('span');
          op.className = 'eq-op';
          op.textContent = '+';
          eqRowEl.appendChild(op);
        }
        const pill = document.createElement('span');
        pill.className = 'eq-pill';
        const p = getPalette(idx);
        pill.style.background = p.pillBg;
        pill.style.color = p.pillText;
        pill.style.borderColor = p.border;
        pill.textContent = String(v);
        eqRowEl.appendChild(pill);
      });

      const eqSign = document.createElement('span');
      eqSign.className = 'eq-op';
      eqSign.textContent = '=';
      eqRowEl.appendChild(eqSign);
    }

    function generateQuizOptions(correctTotal, count) {
      const minVal = count;
      const maxVal = count * 6;
      const set = new Set([correctTotal]);
      const offsets = [-2, -1, 1, 2, -3, 3];
      for (const off of offsets.sort(() => Math.random() - 0.5)) {
        const cand = correctTotal + off;
        if (cand >= minVal && cand <= maxVal) {
          set.add(cand);
        }
        if (set.size >= 3) break;
      }
      while (set.size < 3) {
        set.add(minVal + Math.floor(Math.random() * (maxVal - minVal + 1)));
      }
      return Array.from(set).sort((a, b) => a - b);
    }

    function updateScoreDisplay(values, fromRoll) {
      const t = I18N[lang];
      const total = values.reduce((a, b) => a + b, 0);
      const maxPossible = values.length * 6;
      const allSame = values.length > 1 && values.every(v => v === values[0]);

      if (quizMode && fromRoll) {
        quizSolved = false;
        renderEquationRow(values, true);
        totalNumEl.textContent = '?';
        badgeMsgEl.textContent = values.length === 1 ? t.quizAskCount : t.quizAskSum;

        // Render 3 multiple-choice buttons
        quizChoicesEl.innerHTML = '';
        quizChoicesEl.classList.add('visible');
        const choices = generateQuizOptions(total, values.length);
        choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'quiz-choice-btn';
          btn.textContent = String(choice);
          btn.addEventListener('click', () => {
            if (quizSolved) return;
            if (choice === total) {
              quizSolved = true;
              btn.classList.add('correct');
              totalNumEl.textContent = String(total);
              renderEquationRow(values, false);
              badgeMsgEl.textContent = t.quizRight;
              triggerHaptic([30, 50, 40]);
              playSuccessChime(true);
              launchConfetti();
              speakText(t.speakQuizRight(values, total));
              recordHistory(values, total);
            } else {
              btn.classList.add('wrong');
              btn.disabled = true;
              badgeMsgEl.textContent = t.quizRetry;
              triggerHaptic(40);
              playGentleBoing();
              speakText(t.speakQuizRetry);
            }
          });
          quizChoicesEl.appendChild(btn);
        });

        playTone(587.33, 0.18, 'sine');
        speakText(t.speakQuizPrompt(values));
        return;
      }

      // Standard Display (or initial render)
      quizChoicesEl.classList.remove('visible');
      quizChoicesEl.innerHTML = '';
      renderEquationRow(values, false);
      totalNumEl.textContent = String(total);

      let badge = t.niceRoll;
      let special = false;
      if (!fromRoll) {
        badge = t.readyBadge;
      } else if (total === maxPossible) {
        badge = t.maxRoll;
        special = true;
      } else if (allSame) {
        badge = values.length === 2 ? t.doubles : t.triples;
        special = true;
      } else if (total >= maxPossible - Math.max(1, values.length - 1)) {
        badge = t.highRoll;
      } else if (total === values.length) {
        badge = t.miniRoll;
      }
      badgeMsgEl.textContent = badge;

      if (fromRoll) {
        resultCardEl.classList.remove('pop');
        void resultCardEl.offsetWidth;
        resultCardEl.classList.add('pop');
        setTimeout(() => resultCardEl.classList.remove('pop'), 240);

        playSuccessChime(special);
        if (special) launchConfetti();

        const speechStr = values.length === 1
          ? t.speakSingle(total)
          : `${values.join(' + ')} = ${total}`;
        speakText(speechStr);

        recordHistory(values, total);
      }
    }

    function recordHistory(values, total) {
      const label = values.length === 1 ? `🎲 ${total}` : `🎲 ${values.join('+')} = ${total}`;
      history.unshift(label);
      if (history.length > 6) history.pop();
      historyBar.innerHTML = '';
      history.forEach(item => {
        const chip = document.createElement('div');
        chip.className = 'history-chip';
        chip.textContent = item;
        historyBar.appendChild(chip);
      });
    }

    // =========================================================================
    // 7. Confetti Celebration Engine
    // =========================================================================
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animRunning = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      const colors = ['#ff5757', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6'];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight * 0.45,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.85) * 15,
          size: 7 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.22,
          life: 1
        });
      }
      if (!animRunning) {
        animRunning = true;
        requestAnimationFrame(stepConfetti);
      }
    }

    function stepConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.42;
        p.rot += p.vrot;
        p.life -= 0.016;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        ctx.restore();
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length > 0) {
        requestAnimationFrame(stepConfetti);
      } else {
        animRunning = false;
      }
    }

    // =========================================================================
    // 8. Shake-to-Roll (Mobile & Tablet Accelerometer)
    // =========================================================================
    let lastShakeTime = 0;
    let motionBound = false;

    function handleMotion(e) {
      const acc = e.accelerationIncludingGravity;
      if (!acc) return;
      const totalAcc = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
      if (totalAcc > 32) {
        const now = Date.now();
        if (now - lastShakeTime > 1200) {
          lastShakeTime = now;
          rollDice();
        }
      }
    }

    function enableDeviceMotionIfAvailable() {
      if (motionBound || typeof window.DeviceMotionEvent === 'undefined') return;
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('devicemotion', handleMotion, { passive: true });
              motionBound = true;
            }
          })
          .catch(() => {});
      } else {
        window.addEventListener('devicemotion', handleMotion, { passive: true });
        motionBound = true;
      }
    }

    // =========================================================================
    // 9. UI Controls & Language Refresh
    // =========================================================================
    function applyLanguageUI() {
      const t = I18N[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.getElementById('app-title').textContent = t.title;
      document.getElementById('sound-label').textContent = t.sfx;
      document.getElementById('voice-label').textContent = t.voice;
      document.getElementById('qr-label').textContent = t.qr;
      document.getElementById('lang-label').textContent = t.nextLang;
      document.getElementById('count-caption').textContent = t.countCaption;
      document.getElementById('quiz-label').textContent = quizMode ? t.quizOn : t.quizOff;
      document.getElementById('mat-hint').textContent = t.matHint;
      document.getElementById('roll-btn-text').textContent = t.rollBtn;
      document.getElementById('qr-modal-title').textContent = t.qrTitle;
      document.getElementById('qr-modal-sub').textContent = t.qrSub;
      document.getElementById('copy-url-btn').textContent = t.copyLink;
      document.getElementById('qr-close-btn').textContent = t.close;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key]) el.textContent = t[key];
      });

      if (quizSolved) {
        updateScoreDisplay(diceState.map(d => d.value), false);
      }
    }

    rollBtn.addEventListener('click', () => {
      enableDeviceMotionIfAvailable();
      rollDice();
    });

    playMatEl.addEventListener('click', () => {
      enableDeviceMotionIfAvailable();
      rollDice();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        rollDice();
      }
    });

    document.querySelectorAll('.count-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        diceCount = parseInt(btn.dataset.count, 10);
        buildDiceTray();
      });
    });

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentTheme = btn.dataset.theme;
        diceState.forEach((d, idx) => applyDieTheme(d.cube, idx));
        if (quizSolved) {
          renderEquationRow(diceState.map(d => d.value), false);
        }
      });
    });

    const quizBtn = document.getElementById('quiz-btn');
    quizBtn.addEventListener('click', () => {
      quizMode = !quizMode;
      quizBtn.classList.toggle('active', quizMode);
      document.getElementById('quiz-label').textContent = quizMode ? I18N[lang].quizOn : I18N[lang].quizOff;
      if (quizMode) {
        rollDice();
      } else {
        quizSolved = true;
        updateScoreDisplay(diceState.map(d => d.value), false);
      }
    });

    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', () => {
      sfxEnabled = !sfxEnabled;
      soundBtn.classList.toggle('active', sfxEnabled);
      document.getElementById('sound-icon').textContent = sfxEnabled ? '🔊' : '🔇';
    });

    const voiceBtn = document.getElementById('voice-btn');
    voiceBtn.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      voiceBtn.classList.toggle('active', voiceEnabled);
      document.getElementById('voice-icon').textContent = voiceEnabled ? '🗣️' : '🙊';
      if (!voiceEnabled && tts) tts.stop();
    });

    document.getElementById('lang-btn').addEventListener('click', () => {
      lang = lang === 'zh' ? 'en' : 'zh';
      if (tts) tts.options.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
      applyLanguageUI();
    });

    // QR Code Modal & Share
    const qrModal = document.getElementById('qr-modal');
    const qrUrlBox = document.getElementById('qr-url-box');
    const canonicalUrl = window.location.protocol.startsWith('http')
      ? window.location.href.split('#')[0]
      : 'https://ruixuandai.github.io/happy-dice/dice/';
    qrUrlBox.textContent = canonicalUrl;

    document.getElementById('qr-btn').addEventListener('click', () => {
      qrModal.classList.add('open');
    });
    document.getElementById('qr-close-btn').addEventListener('click', () => {
      qrModal.classList.remove('open');
    });
    qrModal.addEventListener('click', () => {
      qrModal.classList.remove('open');
    });
    document.getElementById('copy-url-btn').addEventListener('click', async () => {
      const btn = document.getElementById('copy-url-btn');
      try {
        await navigator.clipboard.writeText(canonicalUrl);
        btn.textContent = I18N[lang].copied;
        setTimeout(() => { btn.textContent = I18N[lang].copyLink; }, 1600);
      } catch (_) {}
    });

    // Initialize
    if (!window.DeviceMotionEvent || typeof DeviceMotionEvent.requestPermission !== 'function') {
      enableDeviceMotionIfAvailable();
    }
    buildDiceTray();
    applyLanguageUI();
  </script>
</body>
